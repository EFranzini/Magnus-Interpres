<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magnus Interpres</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #008080;
    font-family: 'MS Sans Serif', Tahoma, Geneva, sans-serif;
    font-size: 13px;
  }
  #window {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: #c0c0c0;
    border: 2px solid #dfdfdf;
    border-right-color: #000;
    border-bottom-color: #000;
  }
  #titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff;
    display: flex;
    align-items: center;
    padding: 4px 5px;
    flex-shrink: 0;
  }
  #titlebar .title {
    flex: 1;
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    letter-spacing: 0.5px;
    user-select: none;
  }
  .btn95 {
    background: #c0c0c0;
    border-top: 2px solid #fff;
    border-left: 2px solid #fff;
    border-right: 2px solid #000;
    border-bottom: 2px solid #000;
    box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
    padding: 4px 9px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    color: #000;
  }
  .btn95:active {
    border-top: 2px solid #000;
    border-left: 2px solid #000;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    box-shadow: inset 1px 1px 0 #808080;
    transform: translate(1px, 1px);
  }
  #titlebar .btn95 {
    font-size: 13px;
    padding: 2px 7px;
  }
  #content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  #rowsGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
    align-items: start;
  }
  .cell {
    position: relative;
    background: #c0c0c0;
    padding: 3px;
    border-top: 1px solid #808080;
    border-left: 1px solid #808080;
    border-right: 1px solid #fff;
    border-bottom: 1px solid #fff;
  }
  textarea.box95 {
    width: 100%;
    height: 170px;
    resize: none;
    padding: 6px;
    font-family: inherit;
    font-size: 16px;
    background: #fff;
    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
  }
  .del-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 18px;
    height: 18px;
    line-height: 10px;
    padding: 0;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .del-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .add-cell {
    display: flex;
    justify-content: center;
    background: transparent;
    border: none;
    padding: 4px 0 0 0;
  }
  #addBtn {
    font-size: 17px;
    padding: 5px 16px;
  }
  #statusbar {
    flex-shrink: 0;
    border-top: 2px solid #fff;
    background: #c0c0c0;
    padding: 3px 8px;
    font-size: 12px;
    color: #000;
  }
</style>
</head>
<body>
  <div id="window">
    <div id="titlebar">
      <button id="resetBtn" class="btn95" title="Click 3 times fast to reset everything">♻️</button>
      <div class="title">Magnus Interpres</div>
      <button id="exportBtn" class="btn95" title="Export right-side texts as .txt">🛫</button>
    </div>
    <div id="content">
      <div id="rowsGrid"></div>
    </div>
    <div id="statusbar">Pairs: <span id="pairCount">1</span></div>
  </div>

<script>
  const grid = document.getElementById('rowsGrid');
  const pairCountEl = document.getElementById('pairCount');
  let rows = []; // { leftCell, rightCell, leftTa, rightTa, delBtn }

  function makeCell(withDelete) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const ta = document.createElement('textarea');
    ta.className = 'box95';
    ta.maxLength = 800;
    ta.spellcheck = false;
    ta.setAttribute('autocorrect', 'off');
    ta.setAttribute('autocapitalize', 'off');
    cell.appendChild(ta);

    let delBtn = null;
    if (withDelete) {
      delBtn = document.createElement('button');
      delBtn.className = 'btn95 del-btn';
      delBtn.textContent = '\u2716';
      delBtn.title = 'Remove this pair';
      cell.appendChild(delBtn);
    }
    return { cell, ta, delBtn };
  }

  function updateDeleteState() {
    const disable = rows.length <= 1;
    rows.forEach(r => { if (r.delBtn) r.delBtn.disabled = disable; });
    pairCountEl.textContent = rows.length;
  }

  function addRow(beforeNode) {
    const left = makeCell(false);
    const right = makeCell(true);
    const rowObj = {
      leftCell: left.cell, rightCell: right.cell,
      leftTa: left.ta, rightTa: right.ta, delBtn: right.delBtn
    };

    right.delBtn.addEventListener('click', () => removeRow(rowObj));

    if (beforeNode) {
      grid.insertBefore(left.cell, beforeNode);
      grid.insertBefore(right.cell, beforeNode);
    } else {
      grid.appendChild(left.cell);
      grid.appendChild(right.cell);
    }
    rows.push(rowObj);
    updateDeleteState();
    return rowObj;
  }

  function removeRow(rowObj) {
    if (rows.length <= 1) return;
    rows = rows.filter(r => r !== rowObj);
    rowObj.leftCell.remove();
    rowObj.rightCell.remove();
    updateDeleteState();
  }

  // --- Add-button row: always the last grid row, right column ---
  const addLeftCell = document.createElement('div');
  addLeftCell.className = 'cell';
  addLeftCell.style.background = 'transparent';
  addLeftCell.style.border = 'none';

  const addRightCell = document.createElement('div');
  addRightCell.className = 'cell add-cell';

  const addBtn = document.createElement('button');
  addBtn.id = 'addBtn';
  addBtn.className = 'btn95';
  addBtn.textContent = '\u2795';
  addBtn.title = 'Add a new pair';
  addRightCell.appendChild(addBtn);

  grid.appendChild(addLeftCell);
  grid.appendChild(addRightCell);

  addBtn.addEventListener('click', () => addRow(addLeftCell));

  // initial single row
  addRow(addLeftCell);

  // --- Reset: 3 clicks within 1.5s ---
  let resetClicks = [];
  document.getElementById('resetBtn').addEventListener('click', () => {
    const now = Date.now();
    resetClicks = resetClicks.filter(t => now - t < 1500);
    resetClicks.push(now);
    if (resetClicks.length >= 3) {
      resetClicks = [];
      doReset();
    }
  });

  function doReset() {
    rows.forEach(r => { r.leftCell.remove(); r.rightCell.remove(); });
    rows = [];
    addRow(addLeftCell);
  }

  // --- Export right-side texts as .txt, blank line between each ---
  document.getElementById('exportBtn').addEventListener('click', () => {
    const text = rows.map(r => r.rightTa.value).join('\n\n');
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'magnus_interpres_export.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
